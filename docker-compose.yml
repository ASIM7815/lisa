services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lisa
      POSTGRES_USER: lisa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-lisa-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - lisa-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lisa -d lisa"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-redis-dev-only}"]
    ports:
      - "6379:6379"
    volumes:
      - lisa-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-local-redis-dev-only}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lisa-postgres:
  lisa-redis:
